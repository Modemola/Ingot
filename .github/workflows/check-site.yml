# Loads the live site in a browser and checks each page shows live data (tools/check-site.mjs).
# Screenshots go to the site-check branch.
name: Check the live site

on:
  workflow_dispatch:
  push:
    branches: [claude/focused-allen-ggzad1]
    paths: [.github/workflows/check-site.yml, tools/check-site.mjs]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock playwright-core@1.63.0 > /dev/null
      - name: Check
        run: CHROME_PATH=$(command -v google-chrome) node tools/check-site.mjs https://ingotx.vercel.app "$RUNNER_TEMP/site-check"
      - name: Publish screenshots
        if: always()
        working-directory: ${{ runner.temp }}/site-check
        run: |
          git init -q -b site-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Site check, run ${GITHUB_RUN_NUMBER}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" site-check
