# One-off: check the CSV feed against the JSON API (same print, under CRE's 250 KB limit).
name: Probe the price feed

on:
  workflow_dispatch:
  push:
    branches: [claude/focused-allen-ggzad1]
    paths: [.github/workflows/probe-feed.yml, oracle/compare-feeds.ts]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: oracle
        run: pnpm install > /dev/null && npx tsx compare-feeds.ts
