# Runs the site's indexer queries against the hosted Envio deployment and prints the results.
name: Check the indexer

on:
  workflow_dispatch:
  push:
    branches: [claude/focused-allen-ggzad1]
    paths: [.github/workflows/check-indexer.yml, tools/check-indexer.mjs, web/components/Activity.tsx, web/lib/indexer.ts]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-indexer.mjs
