# Simulates the Ingot index workflow with the Chainlink CRE CLI, and records the terminal.
#
# `cre workflow simulate` compiles oracle/index-workflow/main.ts to WASM and runs it on the CLI's
# local DON: the cron trigger fires, each node fetches the live venue feed over the HTTP
# capability, the nodes take a median, and the workflow writes its signed report to
# IngotIndexReceiver on Monad testnet (a dry run unless --broadcast). The run is recorded with
# asciinema and rendered to video, then pushed to the cre-simulation branch.
#
# Requires the CRE_API_KEY repository secret (app.chain.link → Organization → APIs).

name: CRE simulation

# By hand only: it needs the CRE_API_KEY secret, and its last step replaces the cre-simulation branch.
on:
  workflow_dispatch:

concurrency:
  group: cre-simulate
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRE_API_KEY: ${{ secrets.CRE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the CRE CLI, asciinema and agg
        run: |
          set -euo pipefail
          curl -sSL https://cre.chain.link/install.sh | bash
          for d in "$HOME/.cre/bin" "$HOME/.local/bin" "$HOME/bin"; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          export PATH="$HOME/.cre/bin:$HOME/.local/bin:$HOME/bin:$PATH"
          command -v cre && cre version || true
          sudo apt-get install -y -qq asciinema ffmpeg > /dev/null
          curl -sSL -o /usr/local/bin/agg https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu || \
            sudo curl -sSL -o /usr/local/bin/agg https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu
          sudo chmod +x /usr/local/bin/agg

      - name: Workflow dependencies
        working-directory: oracle
        run: |
          bun install
          bun x cre-setup || true

      - name: A throwaway key for the simulated chain write
        run: |
          key=0x$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "CRE_ETH_PRIVATE_KEY=$key" >> "$GITHUB_ENV"

      - name: Simulate, recorded
        working-directory: oracle
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/cre"
          cat > "$RUNNER_TEMP/cre/session.sh" <<'EOF'
          #!/usr/bin/env bash
          say() { printf '\n\033[1;33m$ %s\033[0m\n' "$*"; sleep 0.8; }
          run() { say "$*"; "$@"; }
          printf '\033[1;37mIngot · the H100 rental index, published by a Chainlink CRE workflow\033[0m\n'
          run cre version
          run cre whoami
          run cat index-workflow/workflow.yaml
          run cat index-workflow/config.staging.json
          run cre workflow simulate ./index-workflow --target staging-settings --non-interactive --trigger-index 0
          echo "simulate exit code: $?" > "$RUNNER_TEMP/cre/exit.txt"
          sleep 2
          EOF
          chmod +x "$RUNNER_TEMP/cre/session.sh"
          COLUMNS=150 LINES=42 asciinema rec --overwrite --cols 150 --rows 42 -c "$RUNNER_TEMP/cre/session.sh" "$RUNNER_TEMP/cre/simulation.cast"
          cat "$RUNNER_TEMP/cre/exit.txt" || true

      - name: Render
        if: always()
        working-directory: ${{ runner.temp }}/cre
        run: |
          [ -s simulation.cast ] || exit 0
          agg --font-size 22 --theme monokai --idle-time-limit 3 --last-frame-duration 4 simulation.cast simulation.gif
          ffmpeg -y -hide_banner -loglevel error -i simulation.gif -movflags +faststart -pix_fmt yuv420p \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -crf 18 simulation.mp4
          ls -la

      - name: Publish to the cre-simulation branch
        if: always()
        working-directory: ${{ runner.temp }}/cre
        run: |
          set -euo pipefail
          mkdir -p publish
          cp simulation.cast simulation.mp4 exit.txt publish/ 2>/dev/null || true
          cd publish
          git init -q -b cre-simulation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "CRE simulation, run ${GITHUB_RUN_NUMBER}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" cre-simulation
